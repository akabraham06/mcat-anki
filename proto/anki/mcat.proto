syntax = "proto3";

option java_multiple_files = true;

package anki.mcat;

// MCAT Anki Mastery: backend queries that power the study dashboard.
//
// The topic mastery query aggregates per-topic statistics from native
// collection data (cards, note tags, FSRS memory state, and the review log),
// so results are correct on any device that has synced the collection and are
// shared identically between the desktop and mobile apps.
service McatService {
  // Returns per-topic mastery statistics for MCAT-tagged cards.
  rpc GetTopicMastery(TopicMasteryRequest) returns (TopicMasteryList);
  // Returns the three separate scores (memory, performance, readiness) with
  // ranges, coverage, the give-up rule, the best-next-topic recommendation,
  // transfer gaps, and XP. Powers the MCAT dashboard.
  rpc GetExamReadiness(ExamReadinessRequest) returns (ExamReadiness);
  // Returns the single best next topic to study, with a self-explanation.
  rpc GetStudyRecommendation(ExamReadinessRequest)
      returns (StudyRecommendation);
  // Builds an ordered study session, optionally interleaving topics (the
  // toggle under test) versus blocking by topic.
  rpc BuildInterleavedSession(InterleavedSessionRequest)
      returns (InterleavedSession);
  // Per-topic target answer times (and exam metadata) for timed review.
  rpc GetTopicTargets(ExamReadinessRequest) returns (TopicTargetList);

  // "Beat-your-ghost" gamification: the pace of the user's previous BEST timed
  // exam session, so the reviewer can race the user against their past self.
  // Pure engagement layer — this NEVER feeds the readiness/memory/performance
  // scores (PRD Risk 5). Returns available=false on the first run (no prior
  // session to race) or when the ghost feature is disabled in config.
  rpc GetGhostPace(GhostRequest) returns (GhostPace);

  // --- Phase 2: AI features (all gated; degrade to deterministic behaviour)
  // ---

  // Reports whether AI is configured/enabled and reachable, plus the provider,
  // model and checker cutoff, so the dashboard can show an honest status pill.
  rpc GetAiStatus(AiStatusRequest) returns (AiStatus);
  // Reads the current (masked) AI configuration.
  rpc GetAiConfig(AiStatusRequest) returns (AiConfig);
  // Persists AI configuration (base URL, model, api key, cutoff, enable flag).
  rpc SetAiConfig(AiConfig) returns (AiStatus);

  // Source registry (9.3 + 9.9 fake-source defence): register a named,
  // inspectable source with an excerpt used to ground generation.
  rpc RegisterAiSource(AiSource) returns (AiSourceList);
  rpc ListAiSources(AiStatusRequest) returns (AiSourceList);
  rpc RemoveAiSource(AiSourceId) returns (AiSourceList);

  // 9.3 Source-grounded card generation. Never auto-adds notes; returns a
  // review queue of typed/checked candidates.
  rpc GenerateCards(GenerateCardsRequest) returns (GeneratedCardList);
  // 9.4 AI card quality checker: the gate every AI card passes before students
  // see it. Exposed so the UI and eval harness can call it directly.
  rpc CheckCard(CheckCardRequest) returns (CardQualityReport);
  // 9.3 acceptance: turn accepted candidates into real, tagged notes.
  rpc AcceptGeneratedCards(AcceptCardsRequest) returns (AcceptCardsResponse);

  // 9.5 AI explanation for a missed question. Source-grounded, never used as
  // scoring evidence, unavailable offline (review still works).
  rpc ExplainMiss(ExplainMissRequest) returns (MissExplanation);

  // 9.6 AI study planner. Cites app evidence; falls back to the deterministic
  // recommender when AI is off/unavailable.
  rpc GetAiStudyPlan(ExamReadinessRequest) returns (AiStudyPlan);

  // 9.8 AI-assisted performance-question generation from an existing card.
  rpc GeneratePerfQuestions(GeneratePerfQuestionsRequest)
      returns (GeneratedPerfQuestionList);
  // 9.8 acceptance: create MCATPerf-style notes labelled AI-generated.
  rpc AcceptPerfQuestions(AcceptPerfQuestionsRequest)
      returns (AcceptCardsResponse);
}

// Implicitly includes any of the above methods that are not listed in the
// backend service.
service BackendMcatService {}

message ExamReadinessRequest {
  string search = 1;
  string tag_prefix = 2;
  double default_target_seconds = 3;
}

// One of the three scores, always shown with honesty metadata.
message ScoreEstimate {
  string label = 1;
  // False => the give-up rule fired and no number is shown.
  bool available = 2;
  string abstain_reason = 3;
  double point = 4;
  double low = 5;
  double high = 6;
  double scale_min = 7;
  double scale_max = 8;
  string confidence = 9;
  double coverage_percent = 10;
  int64 last_updated = 11;
  repeated string reasons = 12;
  int64 evidence_count = 13;
}

message SectionScore {
  string section_key = 1;
  string section_name = 2;
  bool available = 3;
  double point = 4;
  double low = 5;
  double high = 6;
  double coverage_percent = 7;
  double recall = 8;
  // Mean recall as a percentage (recall * 100), for display convenience.
  double memory_percent = 9;
  // Reviewed knowledge cards contributing recall in this section.
  int64 cards_reviewed = 10;
  // Total tagged knowledge cards in this section.
  int64 cards_total = 11;
}

// Extra memory-side detail so users can see the evidence behind the Memory
// score: how much has been studied, how well it is retained, and how broadly.
message MemoryDetail {
  // Distinct tagged knowledge cards that have been reviewed at least once.
  int64 cards_reviewed = 1;
  // Distinct tagged knowledge cards in the deck.
  int64 cards_total = 2;
  // Mean recall across reviewed knowledge cards, as a percentage.
  double average_retention_percent = 3;
  // Number of graded knowledge-card reviews.
  int64 graded_reviews = 4;
  // Reviewed cards with a mature interval (>= 21 days).
  int64 mature_cards = 5;
  // Reviewed cards below the mature interval.
  int64 young_cards = 6;
  // Taxonomy topics with at least one knowledge card.
  int64 covered_topics = 7;
  // Total taxonomy topics.
  int64 total_topics = 8;
  // Breadth = covered_topics / total_topics, as a percentage.
  double breadth_percent = 9;
}

// Extra performance-side detail (exam-style questions).
message PerformanceDetail {
  // Exam-style questions answered (graded reviews on perf notes).
  int64 questions_answered = 1;
  // Accuracy across those questions, as a percentage.
  double accuracy_percent = 2;
  // Number answered correctly.
  int64 correct = 3;
  // Taxonomy topics with at least one exam-style question review.
  int64 covered_topics = 4;
  // Total taxonomy topics.
  int64 total_topics = 5;
  // Mean response time on exam-style questions, in seconds.
  double average_response_time_secs = 6;
  // Fraction of exam reviews that exceeded the per-topic time target (0..1).
  double overtime_rate = 7;
  // Fraction answered within the time target (1 - overtime_rate).
  double on_time_rate = 8;
}

// Progress toward the readiness give-up gate, so the abstention is transparent.
message ReadinessDetail {
  int64 graded_reviews = 1;
  int64 required_graded_reviews = 2;
  double coverage_percent = 3;
  double required_coverage_percent = 4;
  bool graded_reviews_met = 5;
  bool coverage_met = 6;
  // Speed/pacing sub-signal folded into readiness: speed_factor in 0..1
  // (1 = always within the time target). Reported honestly with its weight and
  // a human-readable reason so it is never a hidden penalty.
  double speed_factor = 7;
  double overtime_rate = 8;
  string speed_reason = 9;
  // The weights used to blend readiness (memory / performance / speed).
  double memory_weight = 10;
  double performance_weight = 11;
  double speed_weight = 12;
}

message ExamReadiness {
  string exam = 1;
  ScoreEstimate memory = 2;
  ScoreEstimate performance = 3;
  ScoreEstimate readiness = 4;
  repeated SectionScore sections = 5;
  double overall_coverage_percent = 6;
  int64 graded_reviews = 7;
  StudyRecommendation recommendation = 8;
  repeated TransferGap transfer_gaps = 9;
  XpSummary xp = 10;
  GiveUpRule give_up_rule = 11;
  MemoryDetail memory_detail = 12;
  PerformanceDetail performance_detail = 13;
  ReadinessDetail readiness_detail = 14;
}

// The written-down abstention rule.
message GiveUpRule {
  int64 min_graded_reviews = 1;
  double min_coverage_percent = 2;
  string description = 3;
}

message StudyRecommendation {
  bool available = 1;
  string topic_key = 2;
  string topic_name = 3;
  string section_key = 4;
  double priority_score = 5;
  string explanation = 6;
  repeated RecommendationCandidate candidates = 7;
}

message RecommendationCandidate {
  string topic_key = 1;
  string topic_name = 2;
  double priority_score = 3;
  double exam_weight = 4;
  double weakness = 5;
  double coverage_gap = 6;
  uint32 due_cards = 7;
}

// Recall-vs-paraphrase: how much recall on knowledge cards exceeds accuracy on
// exam-style questions for the same topic. A near-zero gap means the
// performance model is just copying the memory model.
message TransferGap {
  string topic_key = 1;
  string topic_name = 2;
  bool available = 3;
  double memory_recall = 4;
  double performance_accuracy = 5;
  double gap = 6;
  int64 knowledge_reviews = 7;
  int64 performance_reviews = 8;
}

message XpSummary {
  int64 total_xp = 1;
  int64 reviews_today = 2;
  int64 xp_today = 3;
  int64 streak_days = 4;
  int64 level = 5;
  repeated string badges = 6;
}

message InterleavedSessionRequest {
  string tag_prefix = 1;
  uint32 max_cards = 2;
  // False => blocked (grouped by topic) ordering, for the ablation.
  bool interleave = 3;
}

message InterleavedSession {
  repeated int64 card_ids = 1;
  repeated string topic_keys = 2;
  bool interleaved = 3;
  string log = 4;
}

message TopicTarget {
  string topic_key = 1;
  string topic_name = 2;
  string section_key = 3;
  string section_name = 4;
  double target_seconds = 5;
  uint32 exam_weight = 6;
  bool fact_based = 7;
  bool in_deck = 8;
}

message TopicTargetList {
  repeated TopicTarget targets = 1;
  string tag_prefix = 2;
}

// ---------------------------------------------------------------------------
// "Beat-your-ghost" gamification.
//
// A ghost is the pace profile of the user's previous BEST timed exam session
// (their personal best), derived deterministically from the review log. During
// a timed session the reviewer races the user against this ghost on cumulative
// time and running accuracy. This is a transparent engagement layer only: the
// ghost/session numbers are NEVER an input to the readiness/memory/performance
// scores.
// ---------------------------------------------------------------------------

message GhostRequest {
  // Tag namespace identifying MCAT topics. Empty defaults to "mcat".
  string tag_prefix = 1;
  // Optional search limiting the scope (e.g. a specific deck/tag). Empty
  // considers every exam-style review in the collection.
  string search = 2;
  // Cap the number of per-question pace points returned (0 = no cap).
  uint32 max_questions = 3;
}

// One question's position in the ghost's pace: the running totals after the
// ghost answered this question.
message GhostQuestion {
  // 1-based position of this question within the session.
  uint32 index = 1;
  // Cumulative time (ms) the ghost had spent through this question.
  int64 cumulative_time_ms = 2;
  // Cumulative correct answers the ghost had through this question.
  uint32 cumulative_correct = 3;
  // Whether the ghost answered this specific question correctly.
  bool correct = 4;
}

message GhostPace {
  // False on the first run (no prior session) or when disabled — the reviewer
  // then behaves exactly like a normal timed session with nothing to race.
  bool available = 1;
  // False only when the user has turned the ghost feature off in config.
  bool enabled = 2;
  // Machine-readable explanation when unavailable (first-run vs disabled),
  // suitable for logging.
  string reason = 3;
  // Human label for the ghost, e.g. "Your best: 82% · 11:20 · Jun 30".
  string label = 4;
  // Number of questions in the ghost session.
  uint32 question_count = 5;
  // Ghost accuracy (0..1).
  double accuracy = 6;
  // Ghost total answer time (ms) across the session.
  int64 total_time_ms = 7;
  // Unix seconds when the ghost session started.
  int64 recorded_at = 8;
  // How many prior qualifying sessions were considered when picking the best.
  uint32 sessions_considered = 9;
  // The per-question pace profile (ordered).
  repeated GhostQuestion questions = 10;
}

message TopicMasteryRequest {
  // Optional search limiting the cards considered. Empty matches the whole
  // collection.
  string search = 1;
  // Tag namespace identifying MCAT topics. Empty defaults to "mcat", so a tag
  // like "mcat::biobiochem::metabolism" is section "biobiochem", topic
  // "metabolism".
  string tag_prefix = 2;
  // Per-card target answer time in seconds, used to classify a review as
  // overtime. 0 uses the built-in default.
  double default_target_seconds = 3;
}

message TopicMastery {
  // Full tag path, e.g. "mcat::biobiochem::metabolism".
  string topic_key = 1;
  // Leaf name of the topic, e.g. "metabolism".
  string topic_name = 2;
  // Top-level MCAT section key, e.g. "biobiochem".
  string section = 3;
  uint32 cards_total = 4;
  uint32 cards_seen = 5;
  uint32 cards_mastered = 6;
  // Mean current FSRS recall probability (0..1) across cards with memory state.
  double average_recall_probability = 7;
  double average_response_time_secs = 8;
  // Fraction of rated reviews that exceeded the target time (0..1).
  double overtime_rate = 9;
  // Unix seconds of the most recent review, or 0 if never reviewed.
  int64 last_reviewed_at = 10;
  // 0..1, higher means weaker (surfaced first for study).
  double weakness_score = 11;
  double coverage_percent = 12;
}

message TopicMasteryList {
  repeated TopicMastery topics = 1;
  // Distinct-card rollups across all MCAT-tagged cards in scope.
  uint32 cards_total = 2;
  uint32 cards_seen = 3;
  double overall_coverage_percent = 4;
}

// ---------------------------------------------------------------------------
// Phase 2: AI features.
//
// Every AI response carries `ai_available` + `unavailable_reason`, so callers
// can fall back to deterministic behaviour when AI is unconfigured, offline,
// erroring or rate-limited. Core review/scoring/sync never depend on these.
// ---------------------------------------------------------------------------

// An empty-ish request used by status/list RPCs (tag_prefix optional).
message AiStatusRequest {
  string tag_prefix = 1;
}

// Provider-agnostic, OpenAI-compatible configuration. The api key is masked on
// read (never returned in full) so it is safe to surface in the UI.
message AiConfig {
  string base_url = 1;
  string model = 2;
  // On write: the raw key to store. On read: a masked placeholder (e.g.
  // "sk-...abcd") or empty when unset.
  string api_key = 3;
  // Card-quality passing cutoff (0..1), set before testing. Default 0.7.
  double checker_cutoff = 4;
  bool enabled = 5;
  // True on read when a key is actually stored (so the UI can show "set"
  // without revealing the value).
  bool api_key_set = 6;
}

message AiStatus {
  // available = enabled && (has key or a local/keyless endpoint).
  bool available = 1;
  string reason = 2;
  string provider = 3;
  string model = 4;
  bool configured = 5;
  bool enabled = 6;
  double checker_cutoff = 7;
}

message AiSourceId {
  string source_id = 1;
}

// A named, inspectable source used to ground generation (9.3/9.9).
message AiSource {
  string source_id = 1;
  string source_name = 2;
  // Section / page / chapter reference within the source.
  string source_section = 3;
  // The excerpt/text used for grounding and shown in the source trace.
  string excerpt = 4;
  int64 registered_at = 5;
}

message AiSourceList {
  repeated AiSource sources = 1;
}

// Candidate card status through the review queue (9.3).
enum GeneratedCardStatus {
  GENERATED_CARD_STATUS_UNKNOWN = 0;
  // Failed the quality gate (wrong/vague/trivial/unsupported) — never studied.
  GENERATED_CARD_STATUS_BLOCKED = 1;
  // Passed automated checks; awaiting human acceptance.
  GENERATED_CARD_STATUS_NEEDS_REVIEW = 2;
  // Accepted by the user and turned into a real note.
  GENERATED_CARD_STATUS_ACCEPTED = 3;
  // Rejected by the user.
  GENERATED_CARD_STATUS_REJECTED = 4;
  // Duplicate of an existing note.
  GENERATED_CARD_STATUS_DUPLICATE = 5;
}

// One quality category from the 9.4 checker.
message QualityCategory {
  string key = 1;
  string label = 2;
  bool passed = 3;
  double score = 4;
  string reason = 5;
}

// The 9.4 checker report for a single card.
message CardQualityReport {
  bool ai_available = 1;
  string unavailable_reason = 2;
  repeated QualityCategory categories = 3;
  double overall_score = 4;
  double cutoff = 5;
  bool passed = 6;
  bool duplicate = 7;
  // "Blocked" or "NeedsReview".
  string verdict = 8;
}

message GenerateCardsRequest {
  string source_id = 1;
  uint32 count = 2;
  // Optional taxonomy topic tag or hint (e.g. "mcat::biobiochem::enzymes").
  string topic_hint = 3;
  string tag_prefix = 4;
  // Requested difficulty tier for the whole batch, one of:
  //   "recall"  — basic recall / definition,
  //   "mcat"    — exam-level application / reasoning (the standard band),
  //   "stretch" — harder than the real MCAT (multi-concept integration, edge
  //               cases, wider scope).
  // Empty asks the model for a mixed batch. When set, the tier is authoritative
  // for tagging (every returned card is labelled with that tier) and steers the
  // generation prompt, so the caller can hit an explicit difficulty
  // distribution across a topic.
  string difficulty = 5;
}

message GeneratedCard {
  string source_id = 1;
  string source_name = 2;
  string source_section = 3;
  string question = 4;
  string answer = 5;
  // Full taxonomy tag, e.g. "mcat::biobiochem::enzymes".
  string topic_tag = 6;
  // Difficulty tier: "recall" | "mcat" | "stretch". Accepted cards are tagged
  // "difficulty::<tier>" so the deck spans a wide, measurable difficulty range.
  string difficulty = 7;
  GeneratedCardStatus status = 8;
  CardQualityReport quality = 9;
  // The source excerpt this card was grounded in (inspectable trace).
  string source_excerpt = 10;
}

message GeneratedCardList {
  bool ai_available = 1;
  string unavailable_reason = 2;
  repeated GeneratedCard cards = 3;
  string source_id = 4;
}

message CheckCardRequest {
  string question = 1;
  string answer = 2;
  string topic_tag = 3;
  // Optional; when set it must resolve to a registered source.
  string source_id = 4;
  string source_excerpt = 5;
  string tag_prefix = 6;
}

message AcceptCardsRequest {
  repeated GeneratedCard cards = 1;
  // Destination deck; default "MCAT::AI Generated".
  string deck_name = 2;
  string tag_prefix = 3;
}

message AcceptCardsResponse {
  repeated int64 note_ids = 1;
  uint32 created = 2;
  uint32 skipped = 3;
}

message ExplainMissRequest {
  int64 card_id = 1;
  // Optional: the answer the student chose (for MCQ misses).
  string chosen_answer = 2;
  string tag_prefix = 3;
}

message MissExplanation {
  bool ai_available = 1;
  string unavailable_reason = 2;
  string why_correct = 3;
  string why_chosen_wrong = 4;
  string source_citation = 5;
  string related_topic = 6;
  string suggested_review_action = 7;
  int64 card_id = 8;
}

message AiStudyPlanItem {
  string action = 1;
  int32 minutes = 2;
  string reason = 3;
  // The measured app data behind this item.
  repeated string evidence = 4;
}

message AiStudyPlan {
  bool ai_available = 1;
  string unavailable_reason = 2;
  repeated AiStudyPlanItem items = 3;
  string summary = 4;
  // True when the deterministic recommender was used instead of AI.
  bool used_fallback = 5;
  // The app evidence supplied to (and cited by) the plan.
  repeated string evidence = 6;
  // The deterministic recommender, always available as a fallback.
  StudyRecommendation fallback = 7;
}

message GeneratePerfQuestionsRequest {
  int64 card_id = 1;
  string tag_prefix = 2;
  // Optional registered source id to ground the questions in.
  string source_id = 3;
}

message GeneratedPerfQuestion {
  string question = 1;
  // The correct option / answer.
  string answer = 2;
  string explanation = 3;
  string difficulty = 4;
  string topic_tag = 5;
  string source_id = 6;
  string source_name = 7;
  string source_excerpt = 8;
  GeneratedCardStatus status = 9;
  CardQualityReport quality = 10;
  // Leakage / near-duplicate against existing training/test questions.
  bool leakage = 11;
  string leakage_reason = 12;
}

message GeneratedPerfQuestionList {
  bool ai_available = 1;
  string unavailable_reason = 2;
  int64 card_id = 3;
  string topic_tag = 4;
  string source_id = 5;
  repeated GeneratedPerfQuestion questions = 6;
}

message AcceptPerfQuestionsRequest {
  repeated GeneratedPerfQuestion questions = 1;
  // Destination deck; default "MCAT::AI Generated".
  string deck_name = 2;
  string tag_prefix = 3;
}
