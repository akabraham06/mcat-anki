# XcodeGen spec for the Anki MCAT companion iOS app.
#
# Generate the Xcode project with:
#     brew install xcodegen          # one-time
#     cd mobile/AnkiCompanion && xcodegen generate
#     open AnkiCompanion.xcodeproj
#
# Prerequisites (see mobile/build_ios.sh and gen_swift_proto.sh):
#   1. full Xcode installed and selected (xcode-select -s /Applications/Xcode.app)
#   2. rustup target add aarch64-apple-ios-sim aarch64-apple-ios
#   3. ../build_ios.sh              -> produces ../build/AnkiEngine.xcframework
#   4. ./gen_swift_proto.sh         -> produces ./Generated/*.pb.swift

name: AnkiCompanion
options:
  bundleIdPrefix: net.ankiweb
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.25.0"

targets:
  AnkiCompanion:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.sh"
          - "*.md"
          - "*.plist"
          - "build"
          - "*.xcodeproj"
    dependencies:
      - package: SwiftProtobuf
      # Static engine library packaged as an xcframework (not embedded).
      - framework: ../build/AnkiEngine.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ankiweb.ankicompanion
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "MCAT"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # ---- Code signing (device builds) ----------------------------------
        # These are placeholders that resolve at `xcodegen generate` time from
        # the environment, so a plain `xcodegen generate` (no env) yields an
        # unsigned project that still builds for the Simulator.
        #
        #   DEVELOPMENT_TEAM  – your 10-char Apple Team ID (Membership page in
        #                       developer.apple.com, or Xcode > Settings >
        #                       Accounts). Empty ⇒ no team ⇒ Simulator-only.
        #   CODE_SIGN_STYLE   – Automatic (default) lets Xcode manage the
        #                       provisioning profile via -allowProvisioningUpdates;
        #                       set to Manual to supply your own profile.
        #
        # `${DEVELOPMENT_TEAM}` is a build-setting placeholder: with nothing
        # supplying it, it resolves to empty (Simulator-only). build_ipa.sh /
        # xcodebuild override it on the command line for device archives
        # (`DEVELOPMENT_TEAM=ABCDE12345 ...`). See DISTRIBUTION.md.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        # Simulator SDK never needs a signing identity, regardless of the above.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        # The engine xcframework (mobile/build_ios.sh) ships only the Apple-silicon
        # simulator + device slices (aarch64-apple-ios-sim / aarch64-apple-ios).
        # There is no x86_64 slice, so exclude it from simulator builds — every
        # supported Mac here runs the arm64 simulator.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # The Rust static library pulls in these system libs/frameworks.
        OTHER_LDFLAGS: "-lc++ -lz -liconv -framework Security -framework SystemConfiguration -framework CoreFoundation"
